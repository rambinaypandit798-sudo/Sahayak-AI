name: Build Sahayak AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Fresh Flutter Project Structure
        run: |
          # यह कमांड गिटहब के क्लाउड पर ही पूरी सही एंड्रॉइड/जीआरएडीएल फाइलें खुद जनरेट कर देगा
          flutter create . --org com.sahayak.ai --project-name sahayak_ai --platforms=android

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahayak-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
